name = "wordle-de-duel"
main = "index.mjs"
compatibility_date = "2026-10-11"
workers_dev = true

[observability]
enabled = false

[vars]
ALLOWED_ORIGINS = "https://flegik.github.io,https://wordle-de-duel.wordle-de-flegik-test.workers.dev"

[[d1_databases]]
binding = "DB"
database_name = "wordle-de-duel"
database_id = "ac9e3358-87e5-46de-89bd-2f13e4231a57"
migrations_dir = "migrations"

[triggers]
crons = ["17 3 * * *"]

[assets]
directory = "site"
binding = "ASSETS"
run_worker_first = ["/api/*"]
